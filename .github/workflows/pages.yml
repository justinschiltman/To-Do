# Publishes the app to GitHub Pages on every push to the default branch.
# The first run switches Pages on by itself; nothing to configure by hand.
name: Deploy to GitHub Pages

on:
  push:
    # This repo's default branch is the one the app was built on. main/master
    # are listed too so nothing breaks if the default is ever renamed.
    branches: [claude/nifty-planck-wpydax, main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on first run, so there is nothing to switch
          # on by hand. Needs the pages:write permission granted above.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo is the site: index.html, the worker, the manifest
          # and the icons all need to sit next to each other.
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
