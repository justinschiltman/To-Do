# Publishes the app to GitHub Pages on every push to the default branch.
# Requires Pages to be enabled once: Settings -> Pages -> Source -> GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    # This repo's default branch is the one the app was built on. main/master
    # are listed too so nothing breaks if the default is ever renamed.
    branches: [claude/nifty-planck-wpydax, main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Note: this cannot create the Pages site. Its `enablement` option needs
      # admin rights that the default GITHUB_TOKEN does not have, so Pages is
      # switched on once in the repository settings instead.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo is the site: index.html, the worker, the manifest
          # and the icons all need to sit next to each other.
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
